# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "raxmlng_moose"
description: Select a substitution model for an alignment with RAxML-NG's model selection (MOOSE), without searching a tree.
keywords:
  - phylogeny
  - model selection
  - raxml-ng
tools:
  - "raxmlng":
      description: "RAxML Next Generation: faster, easier-to-use and more flexible RAxML"
      homepage: "https://github.com/amkozlov/raxml-ng"
      documentation: "https://github.com/amkozlov/raxml-ng/wiki"
      tool_dev_url: "https://github.com/amkozlov/raxml-ng"
      doi: "10.1093/bioinformatics/btz305"
      licence: ["AGPL v3"]
      identifier: biotools:raxml-ng

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
    - alignment:
        type: file
        description: Alignment in FASTA format. The data type goes in `ext.args` (`--data-type DNA`).
        pattern: "*.{fasta,fa}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
output:
  best_model:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - "*.raxml.moose.bestModel":
          type: file
          description: The selected model as a model string without fitted values, e.g. `GTR+FO+R10, noname = 1-1478`. Everything before the first comma is accepted by `raxml-ng --model`.
          pattern: "*.raxml.moose.bestModel"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - "*.raxml.log":
          type: file
          description: RAxML-NG log with the models evaluated.
          pattern: "*.raxml.log"
          ontologies: []
  versions_raxmlng:
    - - ${task.process}:
          type: string
          description: The name of the process
      - raxmlng:
          type: string
          description: The name of the tool
      - "raxml-ng --version 2>&1 | sed '/RAxML-NG v/!d;s/.*v. //;s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - raxmlng:
          type: string
          description: The name of the tool
      - "raxml-ng --version 2>&1 | sed '/RAxML-NG v/!d;s/.*v. //;s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
