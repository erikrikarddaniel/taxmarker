---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "weightfilter"
description: |
  Prepare sequences for clustering: strip alignment gap characters (the caller doesn't
  guarantee unaligned input at this point in the pipeline; VSEARCH needs plain
  sequences), then drop any whose weight falls below an absolute --min_weight cutoff,
  reporting them separately rather than silently discarding them. A sequence with no
  entry in the (optional) weight table defaults to weight 1.
keywords:
  - filtering
  - clustering
  - taxmarker
tools:
  - "sativa":
      description: "Freely available tools for computational molecular biology."
      homepage: "None"
      documentation: "None"
      tool_dev_url: "None"
      doi: ""
      licence: ["Biopython License Agreement"]
      identifier: biotools:biopython

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information. e.g. `[
          id:'sample1' ]`
    - taxonomy:
        type: file
        description: Tab-separated declared taxonomy labels (seq_name<TAB>rank1;rank2;...).
        pattern: "*.{tax,tsv}"
    - sequences:
        type: file
        description: Unaligned, labeled sequences in FASTA format (same sequences named in taxonomy).
        pattern: "*.{fa,fasta,fna}"
    - weights:
        type: file
        description: Optional two-column weight table (seq_name<TAB>weight). Absent -> every sequence defaults to weight 1.
        pattern: "*.{tsv,txt}"
    - min_weight:
        type: value
        description: Absolute weight cutoff; sequences below it are excluded.
output:
  taxonomy:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[
            id:'sample1' ]`
      - filtered_taxonomy:
          type: file
          description: Declared taxonomy for sequences at or above --min_weight.
          pattern: "*.weightfiltered.tax"
  sequences:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[
            id:'sample1' ]`
      - filtered_sequences:
          type: file
          description: Sequences at or above --min_weight, content unchanged (still gapped, if it was).
          pattern: "*.weightfiltered.fasta"
  ungapped_sequences:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[
            id:'sample1' ]`
      - ungapped_sequences:
          type: file
          description: Same sequences as `sequences`, with any gap/missing characters stripped -- what VSEARCH clustering needs.
          pattern: "*.weightfiltered.ungapped.fasta"
  excluded:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[
            id:'sample1' ]`
      - excluded_tsv:
          type: file
          description: Sequences dropped for being below --min_weight (seq_name, weight, min_weight_threshold).
          pattern: "*.excluded.tsv"
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The version of Python
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The version of Python
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
